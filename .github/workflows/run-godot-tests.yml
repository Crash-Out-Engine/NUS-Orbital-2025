name: "Run Godot Tests"

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events but only for the "dev" branch
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened, edited]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: croconut/godot-tester@v5.2
        with:
          version: ${{vars.GODOT_VERSION}}
          release_type: "stable"
          import-time: "5"
          test-timeout: "45"
          minimum-pass: "1.0"
          test-dir: "res://tests"
          custom-godot-dl-url: "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_linux.x86_64.zip"
          result-output-file: "test_results.xml"
